# Builds the signed Android app for every published release and attaches it; the app looks for updates there.
name: Android release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BASALT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          BASALT_KEYSTORE_PASSWORD: ${{ secrets.BASALT_KEYSTORE_PASSWORD }}
          BASALT_KEY_ALIAS: ${{ secrets.BASALT_KEY_ALIAS }}
          BASALT_KEY_PASSWORD: ${{ secrets.BASALT_KEY_PASSWORD }}
        run: BASALT_KEYSTORE="$RUNNER_TEMP/release.jks" sh gradlew --no-daemon assembleRelease
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "BasaltNotes-${TAG#v}.apk"
          gh release upload "$TAG" "BasaltNotes-${TAG#v}.apk" --clobber
