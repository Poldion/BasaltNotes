# GitHub Actions: build, tests, translation check and Docker build on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up git for the vault tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@localhost"
      - run: npm ci --no-audit --no-fund
      - name: Build (server, UI, SDK, plugins)
        run: npm run build
      - name: Tests
        run: npm test
      - name: Check translations
        run: node scripts/i18n-check.mjs --strict

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        working-directory: android
        run: sh gradlew --no-daemon assembleDebug

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not published)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: basaltnotes:ci
